<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>太平洋西北亲子营地指南</title>    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/camping-guide/images/logo.svg" />
    <link rel="manifest" href="/camping-guide/manifest.webmanifest" />
    <meta name="theme-color" content="#1e4030" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="营地指南" />
    <link rel="apple-touch-icon" href="/camping-guide/icons/apple-touch-icon-180.png" />
    <script>
      // Single Page Apps for GitHub Pages (rafrex/spa-github-pages, MIT)
      // 还原 404.html 编码进查询串的深链路径（/?/campground/7 -> /campground/7），
      // 在应用启动前用 replaceState 恢复，wouter 才能按原路径路由。
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          var base = l.pathname.endsWith("/")
            ? l.pathname.slice(0, -1)
            : l.pathname;
          window.history.replaceState(null, null, base + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
